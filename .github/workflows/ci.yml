name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/rice.py --output /tmp/rice.md
      - run: python learning-notes/mock_agent.py
